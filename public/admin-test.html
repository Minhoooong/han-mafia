<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>흑야 관리자 테스트</title><style>
:root{color-scheme:dark;font-family:Pretendard,system-ui,sans-serif;background:#080a0f;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#201750 0,transparent 30%),#080a0f}.wrap{width:min(1200px,calc(100% - 28px));margin:28px auto}.top,.card{background:#11151de8;border:1px solid #ffffff14;border-radius:20px;box-shadow:0 20px 60px #0007}.top{padding:22px 24px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:25px}.phase{color:#ad9cff;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{padding:20px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.controls button,.row button{min-height:44px;border:1px solid #ffffff18;border-radius:12px;background:#242a36;color:#fff;font-weight:750;cursor:pointer}.controls button:hover,.row button:hover{background:#342d63}.controls .accent{background:#684ce0}.controls .danger{background:#54202a}.players,.log{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 12px;border-radius:12px;background:#ffffff08}.row.dead{opacity:.45}.role{color:#ad9cff}.bot{font-size:11px;color:#54d7ad}.log{max-height:390px;overflow:auto}.entry{padding:9px 11px;border-radius:10px;background:#ffffff07;color:#aeb5c1;font-size:13px}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.muted{color:#8b93a2;font-size:13px}@media(max-width:780px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.roles{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><div class="muted">ADMIN TEST CONSOLE</div><h1>흑야 관리자 기능 테스트</h1></div><div><span id="phase" class="phase">대기실</span> · <span id="round">0라운드</span></div></header><section class="grid"><div class="card"><h2>빠른 제어</h2><div class="controls"><button data-cmd="bots">봇 5명 충원</button><button data-cmd="start" class="accent">게임 시작</button><button data-cmd="next" class="accent">다음 단계</button><button data-cmd="reset">상태 초기화</button><button data-cmd="removeBots">봇 제거</button><button data-cmd="new" class="danger">새 테스트방</button></div><p class="muted">밤 행동과 투표는 테스트봇이 자동으로 선택합니다.</p><h2>플레이어</h2><div id="players" class="players"></div></div><div><div class="card"><h2>전체 역할</h2><div id="roles" class="roles"></div></div><div class="card" style="margin-top:16px"><h2>이벤트 로그</h2><div id="log" class="log"></div></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=q=>document.querySelector(q),labels={lobby:'대기실',reveal:'역할 확인',night:'밤',dawn:'새벽 결과',discussion:'토론',vote:'투표',result:'투표 결과',ended:'게임 종료'};let st;function send(cmd,id){s.emit('test:command',{cmd,id},r=>{if(!r?.ok)alert(r?.error||'실패')})}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));s.on('test:state',x=>{st=x;$('#phase').textContent=labels[x.phase]||x.phase;$('#round').textContent=`${x.round}라운드`;$('#players').innerHTML=x.players.map(p=>`<div class="row ${p.alive?'':'dead'}"><div><strong>${esc(p.nickname)}</strong> ${p.isBot?'<span class="bot">BOT</span>':''}</div><button onclick="send('${p.alive?'kill':'revive'}','${p.id}')">${p.alive?'사망':'부활'}</button></div>`).join('');$('#roles').innerHTML=x.players.map(p=>`<div class="row ${p.alive?'':'dead'}"><span>${esc(p.nickname)}</span><strong class="role">${esc(p.roleName)}</strong></div>`).join('');$('#log').innerHTML=[...x.log].reverse().map(e=>`<div class="entry">${new Date(e.at).toLocaleTimeString()} · ${esc(e.text)}</div>`).join('')||'<div class="muted">로그 없음</div>'});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
